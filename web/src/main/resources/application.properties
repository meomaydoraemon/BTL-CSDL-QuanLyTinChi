spring.application.name=QuanLyTinChi
server.port=8080

# ---------------------------------------------------------------------
# Kết nối SQL Server - GIÁ TRỊ MẶC ĐỊNH, không sửa ở đây.
# Máy nào khác mặc định: chép web\config\application.properties.example
# thành web\config\application.properties rồi sửa trong file đó (không đưa lên git).
#   qltc.db.server   : máy chủ, mặc định localhost
#   qltc.db.port     : cổng TCP, mặc định 1433 (phải bật TCP/IP trong Configuration Manager)
#   qltc.sql.instance: tên instance cho sqlcmd / kiểm tra dịch vụ (SQLEXPRESS, hoặc MSSQLSERVER nếu là bản mặc định)
# ---------------------------------------------------------------------
qltc.db.server=localhost
qltc.db.port=1433
qltc.db.name=QuanLyTinChi
qltc.sql.instance=SQLEXPRESS

# Đăng nhập Windows Authentication (cần web\lib\mssql-jdbc_auth-*.dll, tự tải khi build)
spring.datasource.url=jdbc:sqlserver://${qltc.db.server}:${qltc.db.port};databaseName=${qltc.db.name};integratedSecurity=true;encrypt=true;trustServerCertificate=true
spring.datasource.hikari.maximum-pool-size=5

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Khi chạy bằng file .jar (biểu tượng Quản lý tín chỉ): ghi log ra web\logs\app.log
logging.file.name=logs/app.log
